[package]
name = "uninote-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "uninote"
path = "src/main.rs"

[dependencies]
uninote-stroke = { path = "../uninote-stroke" }
uninote-core = { path = "../uninote-core" }
uninote-storage = { path = "../uninote-storage" }
gtk4 = { version = "0.9", features = ["v4_10"] }
libadwaita = "0.7"
glib = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cairo-rs = { version = "0.20", features = ["pdf", "png", "v1_16"] }
poppler = { version = "0.6.0", features = ["render"] }
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
uuid = { version = "1.10", features = ["v4"] }
cairo-rs = { version = "0.20", features = ["pdf", "png", "v1_16"] }

[features]
default = []
