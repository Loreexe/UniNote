name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag di rilascio (es. v0.4.7)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-tarball:
    name: Build Standalone Tarball (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libcairo2-dev \
            libpoppler-glib-dev \
            libsqlite3-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release -p uninote-app

      - name: Assemble standalone distribution tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ -z "$VERSION" || "$VERSION" == *"/"* ]] && VERSION="${{ github.event.inputs.tag_name || '0.3.0' }}"
          VERSION="${VERSION#v}"
          DIST_NAME="uninote-v${VERSION}-linux-x86_64"
          mkdir -p "staging/${DIST_NAME}/bin" "staging/${DIST_NAME}/share"
          
          # Binario
          cp target/release/uninote "staging/${DIST_NAME}/bin/"
          
          # Risorse XDG
          cp -r data/icons "staging/${DIST_NAME}/share/"
          mkdir -p "staging/${DIST_NAME}/share/applications" "staging/${DIST_NAME}/share/metainfo" "staging/${DIST_NAME}/share/mime/packages"
          cp data/org.uninote.UniNote.desktop "staging/${DIST_NAME}/share/applications/"
          cp data/org.uninote.UniNote.metainfo.xml "staging/${DIST_NAME}/share/metainfo/"
          cp data/org.uninote.UniNote.xml "staging/${DIST_NAME}/share/mime/packages/"
          cp LICENSE "staging/${DIST_NAME}/"
          cp README.md "staging/${DIST_NAME}/"
          
          # Script di installazione automatica
          cat << 'EOF' > "staging/${DIST_NAME}/install.sh"
          #!/usr/bin/env bash
          set -e
          PREFIX="${PREFIX:-/usr/local}"
          echo "Installazione di UniNote in ${PREFIX}..."
          install -Dm755 bin/uninote "${PREFIX}/bin/uninote"
          mkdir -p "${PREFIX}/share"
          cp -r share/* "${PREFIX}/share/"
          if command -v update-desktop-database >/dev/null 2>&1; then
              update-desktop-database "${PREFIX}/share/applications" || true
          fi
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
              gtk-update-icon-cache -q -t -f "${PREFIX}/share/icons/hicolor" || true
          fi
          if command -v update-mime-database >/dev/null 2>&1; then
              update-mime-database "${PREFIX}/share/mime" || true
          fi
          echo "UniNote installato con successo!"
          EOF
          chmod +x "staging/${DIST_NAME}/install.sh"
          
          tar -czf "${DIST_NAME}.tar.gz" -C staging "${DIST_NAME}"
          sha256sum "${DIST_NAME}.tar.gz" > "${DIST_NAME}.tar.gz.sha256"

      - name: Upload Standalone Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-tarball
          path: uninote-v*.tar.gz*

  build-flatpak:
    name: Build Flatpak Bundle (.flatpak)
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: org.uninote.UniNote.flatpak
          manifest-path: packaging/flatpak/org.uninote.UniNote.yaml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: org.uninote.UniNote.flatpak

  build-arch:
    name: Build Arch Package (.pkg.tar.zst)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          if command -v gpg >/dev/null 2>&1; then
            pacman-key --init
            pacman-key --populate archlinux
          fi
          pacman -Syu --noconfirm --needed \
            git rust pkgconf gtk4 libadwaita poppler-glib cairo \
            hicolor-icon-theme shared-mime-info

      - name: Verify PKGBUILD version matches release tag
        env:
          RAW_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${RAW_TAG#refs/tags/}"
          TAG="${TAG#v}"
          PKGVER="$(sed -n 's/^pkgver=//p' packaging/aur/uninote/PKGBUILD | head -n1)"
          if [ "${PKGVER}" != "${TAG}" ]; then
            echo "::error::pkgver della ricetta AUR (${PKGVER}) diverso dal tag di release (${TAG}). Aggiorna packaging/aur/uninote/PKGBUILD e .SRCINFO prima del tag."
            exit 1
          fi

      - name: Build package with makepkg
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^pkgver=//p' packaging/aur/uninote/PKGBUILD | head -n1)"

          # Crea archivio sorgenti identico al tarball di rilascio GitHub
          mkdir -p "/tmp/UniNote-${VERSION}"
          cp -r Cargo.toml Cargo.lock crates data packaging LICENSE README.md "/tmp/UniNote-${VERSION}/"
          tar -czf "/tmp/uninote-${VERSION}.tar.gz" -C /tmp "UniNote-${VERSION}"
          rm -rf "/tmp/UniNote-${VERSION}"
          SUM="$(sha256sum "/tmp/uninote-${VERSION}.tar.gz" | cut -d' ' -f1)"

          useradd -m builder
          mkdir -p /home/builder/build
          cp packaging/aur/uninote/PKGBUILD /home/builder/build/
          cp "/tmp/uninote-${VERSION}.tar.gz" /home/builder/build/
          cd /home/builder/build
          sed -i 's|^source=.*|source=("uninote-$pkgver.tar.gz")|' PKGBUILD
          sed -i "s|^sha256sums=.*|sha256sums=('${SUM}')|" PKGBUILD

          chown -R builder:builder /home/builder/build
          su - builder -c 'cd /home/builder/build && makepkg --noconfirm --nodeps --nocheck'
          cp /home/builder/build/*.pkg.tar.zst "$GITHUB_WORKSPACE/"

      - name: Upload Arch Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: "*.pkg.tar.zst"
          if-no-files-found: error

  create-release:
    name: Publish GitHub Release
    needs: [build-tarball, build-flatpak, build-arch]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/

      - name: Prepare Release Directory
        run: |
          mkdir -p dist
          find release-assets/ -type f -exec cp -v {} dist/ \;
          ls -la dist/

      - name: Compose release body
        env:
          RAW_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${RAW_TAG#refs/tags/}"
          TAG="${TAG#v}"
          NOTES_FILE="packaging/release-notes/v${TAG}.md"

          if [ -f "${NOTES_FILE}" ]; then
            cp "${NOTES_FILE}" release-body.md
            echo "Note di rilascio caricate da ${NOTES_FILE}"
          else
            echo "::warning::${NOTES_FILE} non trovato: generazione automatica del corpo release da git log."
            PREV="$(git describe --tags --abbrev=0 "v${TAG}^" 2>/dev/null || true)"
            if [ -n "${PREV}" ]; then
              RANGE="${PREV}..v${TAG}"
            else
              RANGE="v${TAG}"
            fi
            COMMITS="$(git log --no-merges --pretty='- %s' "${RANGE}" | head -n 20 || true)"
            {
              echo "## 🚀 UniNote v${TAG} — Release"
              echo
              echo "Nuova release di UniNote v${TAG}. I pacchetti precompilati sono allegati a questa release."
              echo "La suite di test Rust del progetto è eseguita localmente prima del tag; il workflow di release compila e impacchetta gli artefatti."
              echo
              echo "---"
              echo
              echo "### 🌟 Punti Chiave dell'Aggiornamento"
              echo
              echo "${COMMITS}"
              echo
              echo "---"
              echo
              echo "### 📦 Come Installare o Aggiornare"
              echo
              echo "#### 🐧 Flatpak (Consigliato per tutte le distribuzioni Linux)"
              echo '```bash'
              echo "flatpak install --user ./org.uninote.UniNote.flatpak"
              echo '```'
              echo
              echo "#### 📁 Pacchetto Tarball Portatile (Linux x86_64)"
              echo '```bash'
              echo "tar -xzf uninote-v${TAG}-linux-x86_64.tar.gz"
              echo "cd uninote-v${TAG}-linux-x86_64 && ./install.sh"
              echo '```'
              echo
              echo "#### 🏗️ Arch Linux / CachyOS (Pacchetto precompilato)"
              echo '```bash'
              echo "sudo pacman -U uninote-${TAG}-1-x86_64.pkg.tar.zst"
              echo '```'
              echo
              echo "---"
              echo
              echo "### 🛡️ Affidabilità e Retrocompatibilità"
              echo
              echo "- Formato file .uninote retrocompatibile con le release precedenti."
              echo "- Nessuna cache persistita su disco tra le sessioni."
              echo
              echo "---"
              echo
              echo "**Changelog Dettagliato dei Commit:** https://github.com/Loreexe/UniNote/commits/v${TAG}"
            } > release-body.md
          fi
          echo "Anteprima del corpo release:"
          head -n 10 release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: UniNote ${{ github.event.inputs.tag_name || github.ref_name }}
          body_path: release-body.md
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            dist/*
