name: Diagnostica GTK (temporaneo)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress-settings-tests:
    name: Stress test suite impostazioni
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libcairo2-dev \
            libpoppler-glib-dev \
            libsqlite3-dev \
            xvfb

      - name: Setup Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build test binary
        run: cargo test -p uninote-app --test settings_ux_github_tests --no-run

      - name: Repeat settings suite in search of flakiness
        run: |
          set -o pipefail
          for i in $(seq 1 40); do
            if ! xvfb-run -a cargo test -p uninote-app --test settings_ux_github_tests -- --test-threads=1 > "/tmp/gtk_run_${i}.log" 2>&1; then
              echo "::error::Fallimento al giro ${i}"
              cat "/tmp/gtk_run_${i}.log"
              if [ -f /tmp/uninote_gtk_test_panic.log ]; then
                echo "::group::Payload del panic"
                cat /tmp/uninote_gtk_test_panic.log
                echo "::endgroup::"
              fi
              exit 1
            fi
            echo "giro ${i} ok"
          done
          echo "40 giri verdi consecutivi"
