<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512" viewBox="0 0 36 36">
  <title>UniNote</title>

  <defs>
    <linearGradient id="bg"
                    x1="0" y1="0" x2="36" y2="36"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#004D65"/>
      <stop offset="1" stop-color="#00222E"/>
    </linearGradient>

    <linearGradient id="body"
                    x1="-1.8" y1="0" x2="1.8" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#38A9D5"/>
      <stop offset=".38" stop-color="#9CE5FF"/>
      <stop offset=".68" stop-color="#6DD2FF"/>
      <stop offset="1" stop-color="#339FC8"/>
    </linearGradient>

    <linearGradient id="metal"
                    x1="-1.5" y1="0" x2="1.5" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#8FAFBD"/>
      <stop offset=".45" stop-color="#F0FAFF"/>
      <stop offset="1" stop-color="#A0C3D3"/>
    </linearGradient>
  </defs>

  <!-- Sfondo -->
  <rect width="36" height="36" rx="8.5"
        fill="url(#bg)"
        stroke="#6DD2FF" stroke-opacity=".22"/>

  <!-- U -->
  <path d="M10.5 9.5V20c0 5.5 4 8.5 7.5 8.5"
        fill="none"
        stroke="#ECEFF4"
        stroke-width="3.6"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Penna a sfera -->
  <g transform="translate(18 28.5) rotate(25)"
     stroke-linecap="round"
     stroke-linejoin="round">

    <rect x="-.85" y="-21.2"
          width="1.7" height="1.8" rx=".5"
          fill="url(#metal)"/>

    <rect x="-1.75" y="-19.8"
          width="3.5" height="13.7" rx="1.35"
          fill="url(#body)"
          stroke="#B2EAFF" stroke-width=".35"/>

    <path d="M-.85-18.1V-10.3"
          fill="none"
          stroke="#DCFAFF"
          stroke-opacity=".65"
          stroke-width=".4"/>

    <path d="M.85-18.8
             H2
             Q2.55-18.8 2.55-18.15
             V-13.5
             Q2.55-12.9 2.05-12.9"
          fill="none"
          stroke="#D8F3FF"
          stroke-width=".65"/>

    <path d="M-1.75-8.8H1.75
             L1.5-4.7
             H-1.5Z"
          fill="#176782"
          stroke="#70CDEC"
          stroke-width=".35"/>

    <path d="M-1.38-7.8H1.38
             M-1.34-6.8H1.34
             M-1.28-5.8H1.28"
          fill="none"
          stroke="#78CBE5"
          stroke-opacity=".65"
          stroke-width=".35"/>

    <path d="M-1.5-4.7H1.5
             L.38-.7
             H-.38Z"
          fill="url(#metal)"
          stroke="#BADCEB"
          stroke-width=".3"/>

    <path d="M0-.8V0"
          fill="none"
          stroke="#DFF6FF"
          stroke-width=".65"/>
  </g>
</svg>
